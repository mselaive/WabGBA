<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#231e58" />
    <title>WabGBA</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- El juego -->
    <div id="player">
      <div id="screen">
        <canvas id="canvas" width="240" height="160"></canvas>
      </div>

      <div id="toolbar">
        <button id="btn-menu" class="px-btn" title="Menú: juegos, misiones, logros y participantes">☰ MENÚ</button>
        <button id="btn-pause" class="px-btn ghost" title="Pausar o seguir (P)">⏸</button>
        <button id="btn-speed" class="px-btn ghost" title="Velocidad (mantener Espacio para acelerar)">x1</button>
        <span class="spacer"></span>
        <button id="btn-mute" class="px-btn ghost" title="Silenciar (M)">🔊</button>
        <button id="btn-touch" class="px-btn ghost" title="Mostrar u ocultar los controles táctiles">🎮</button>
        <button id="btn-full" class="px-btn ghost" title="Pantalla completa">⛶</button>
      </div>

      <div id="touch">
        <button class="pad shoulder l" data-btn="L">L</button>
        <button class="pad shoulder r" data-btn="R">R</button>
        <div id="dpad"><span></span></div>
        <div id="ab">
          <button class="pad round b" data-btn="B">B</button>
          <button class="pad round a" data-btn="A">A</button>
        </div>
        <div id="meta">
          <button class="pad pill" data-btn="Select">Select</button>
          <button class="pad pill" data-btn="Start">Start</button>
        </div>
      </div>
    </div>

    <!-- El menú -->
    <div id="hub" class="scene">
      <header id="hub-head">
        <div class="logo" aria-label="WabGBA"><span>W</span><span>a</span><span>b</span><span class="alt">G</span><span class="alt">B</span><span class="alt">A</span></div>
        <div id="account">
          <span id="account-name"></span>
          <button id="btn-settings" class="px-btn small ghost" title="Controles y ajustes">⚙</button>
          <button id="btn-account" class="px-btn small" hidden>ENTRAR</button>
        </div>
      </header>

      <nav id="tabs">
        <button data-tab="play"><i>🎮</i><span>JUGAR</span></button>
        <button data-tab="feed"><i>📜</i><span>HISTORIAL</span></button>
        <button data-tab="trophies"><i>🏆</i><span>LOGROS</span></button>
        <button data-tab="players"><i>👥</i><span>PARTICIPANTES</span></button>
      </nav>

      <main id="tab-body">
        <section id="tab-play">
          <button id="btn-resume" class="px-btn big" hidden>▶ VOLVER AL JUEGO</button>
          <h2 class="px-title">Tus cartuchos</h2>
          <ul id="roms"></ul>
          <p class="hint" id="play-note"></p>
          <button id="btn-export" class="link" hidden>Descargar una copia de la partida</button>
          <button id="btn-reset" class="link" hidden>Reiniciar mi partida desde cero</button>
        </section>
        <section id="tab-feed" hidden></section>
        <section id="tab-trophies" hidden></section>
        <section id="tab-players" hidden></section>
      </main>

      <footer id="textbox" class="box"><p id="textbox-text"></p><i class="more">▼</i></footer>
    </div>

    <!-- La entrada -->
    <div id="login" class="scene" hidden>
      <div class="console">
        <div class="bump l"></div>
        <div class="bump r"></div>
        <div class="side">
          <div class="deco-dpad" id="deco-dpad" title="Arriba y abajo cambian de campo">
            <button type="button" data-dir="up" aria-label="Arriba"></button>
            <button type="button" data-dir="down" aria-label="Abajo"></button>
          </div>
        </div>
        <div class="bezel">
          <form id="login-form" class="lcd" novalidate>
            <div class="logo big" aria-label="WabGBA"><span>W</span><span>a</span><span>b</span><span class="alt">G</span><span class="alt">B</span><span class="alt">A</span></div>
            <p id="login-sub" class="px-title">¡Hola, entrenador!</p>
            <label><span>USUARIO</span>
              <input id="login-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" />
            </label>
            <label><span>CONTRASEÑA</span>
              <input id="login-pass" type="password" autocomplete="current-password" />
            </label>
            <label id="login-invite-row" hidden><span>INVITACIÓN</span>
              <input id="login-invite" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" />
            </label>
            <p id="login-error"></p>
            <button id="login-submit" class="px-btn big" type="submit">▶ ENTRAR</button>
            <div class="links">
              <button id="login-switch" class="link" type="button">Crear una cuenta</button>
              <button id="login-skip" class="link" type="button">Seguir sin cuenta</button>
            </div>
          </form>
          <div class="bezel-label"><i></i>POWER</div>
        </div>
        <div class="side">
          <div class="deco-ab">
            <button type="button" id="deco-b" title="B: borrar">B</button>
            <button type="button" id="deco-a" title="A: entrar">A</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Ajustes: controles (todos) y reglas del sitio (sólo quien administra) -->
    <div id="settings" class="scene" hidden>
      <div class="panel">
        <header>
          <h2 class="px-title">⚙ Ajustes</h2>
          <button id="btn-settings-close" class="px-btn small">✕ CERRAR</button>
        </header>

        <section class="box">
          <h3 class="px-title">Controles</h3>
          <p class="sub">Tocá una acción y después la tecla que quieras usar.</p>
          <div id="bindings"></div>
          <button id="btn-controls-reset" class="link dark" type="button">Volver a los de fábrica</button>
        </section>

        <section id="admin" class="box" hidden>
          <h3 class="px-title">Reglas del randomlocke</h3>
          <p class="sub">Sólo vos ves esta parte.</p>
          <label><span>VIDAS POR PARTICIPANTE</span>
            <input id="set-lives" type="number" min="1" max="99" />
          </label>
          <label><span>WEBHOOK DE DISCORD (OPCIONAL)</span>
            <input id="set-webhook" type="url" placeholder="https://discord.com/api/webhooks/…" autocomplete="off" spellcheck="false" />
          </label>
          <p id="set-status" class="sub"></p>
          <button id="btn-set-save" class="px-btn" type="button">GUARDAR REGLAS</button>
        </section>
      </div>
    </div>

    <div id="achv-pop" class="box">
      <img class="shot" alt="" hidden />
      <span class="icon"></span>
      <div><small></small><b></b></div>
    </div>

    <input id="file-rom" type="file" accept=".gba,.gbc,.gb" hidden />
    <div id="toast"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
